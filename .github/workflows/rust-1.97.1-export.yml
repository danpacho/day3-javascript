name: Export Rust 1.97.1 toolchain

on:
  push:
    branches:
      - snowbrain-rust-1-97-1-bootstrap

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download official standalone toolchain
        shell: bash
        run: |
          set -euo pipefail
          url="https://static.rust-lang.org/dist/2026-07-16/rust-1.97.1-x86_64-unknown-linux-gnu.tar.xz"
          file="rust-1.97.1-x86_64-unknown-linux-gnu.tar.xz"
          curl --fail --location --retry 5 --retry-all-errors "$url" --output "$file"
          echo "88f28fa9af20594179f85d6df67078dfd6fa93e2f6da5e1e9b0ac4997988ca4f  $file" | sha256sum --check --strict
      - name: Upload verified toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rust-1.97.1-x86_64-unknown-linux-gnu
          path: rust-1.97.1-x86_64-unknown-linux-gnu.tar.xz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
