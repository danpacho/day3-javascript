name: Export complete Rust 1.97.1 toolchain

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Install exact toolchain and components
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup run 1.97.1 rustc --version --verbose
          rustup run 1.97.1 cargo --version
          rustup run 1.97.1 rustfmt --version
          rustup run 1.97.1 cargo clippy --version
      - name: Package exact installed toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(rustup toolchain list | awk '/^1\.97\.1-/ {print $1; exit}')"
          test -n "$toolchain"
          tar -C "$HOME/.rustup/toolchains" -cJf rust-1.97.1-complete-x86_64-unknown-linux-gnu.tar.xz "$toolchain"
          sha256sum rust-1.97.1-complete-x86_64-unknown-linux-gnu.tar.xz > rust-1.97.1-complete-x86_64-unknown-linux-gnu.tar.xz.sha256
      - name: Upload verified complete toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rust-1.97.1-complete-x86_64-unknown-linux-gnu
          path: |
            rust-1.97.1-complete-x86_64-unknown-linux-gnu.tar.xz
            rust-1.97.1-complete-x86_64-unknown-linux-gnu.tar.xz.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
